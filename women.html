<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>القسم النسائي | مجمع حمزه الشطري</title>

<meta name="theme-color" content="#111827">

<link rel="icon" href="5FBF3B90-553B-424D-A9B1-1BE2F7F9362B.png">

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- Loader -->

<div id="loader" class="loader">

<div class="spinner"></div>

<p>جاري تحميل القسم النسائي...</p>

</div>

<!-- Header -->

<header class="main-header">
    <div class="container header-container">

        <button class="back-header-btn" onclick="history.back()">
            <i class="fa-solid fa-arrow-right"></i>
        </button>

        <a href="index.html" class="logo">
            <img src="5FBF3B90-553B-424D-A9B1-1BE2F7F9362B.png"
                 alt="مجمع حمزه الشطري"
                 style="width:40px;height:40px;border-radius:50%;">
            <span>مجمع حمزه الشطري</span>
        </a>

        <div class="header-actions">

            <button id="darkBtn" class="header-btn">
                <i class="fa-solid fa-moon"></i>
            </button>

            <a href="cart.html" class="header-btn cart-icon">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cartCount">0</span>
            </a>

        </div>

    </div>
</header>

<!-- عنوان الصفحة -->

<section class="page-title">

<div class="container">

<h1>

<i class="fa-solid fa-person-dress"></i>

القسم النسائي

</h1>

<p>

جميع موديلات القسم النسائي متوفرة بالجملة

</p>

</div>

</section>

<!-- البحث -->

<section class="search-section">

<div class="container">

<input
type="search"
id="searchInput"
placeholder="ابحث عن منتج..."
autocomplete="off">

</div>

</section>

<!-- المنتجات -->

<main class="container">

<div id="productsGrid" class="products-grid">

<div class="loading-products">

جاري تحميل المنتجات...

</div>

</div>

</main>
<script type="module">

import { db } from "./js/firebase.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const grid = document.getElementById("productsGrid");
const searchInput = document.getElementById("searchInput");
const darkBtn = document.getElementById("darkBtn");
const cartCount = document.getElementById("cartCount");

let allProducts = [];

async function loadWomenProducts(){

grid.innerHTML=`
<div class="loading-products">
<i class="fa-solid fa-spinner fa-spin"></i>
<p>جاري تحميل المنتجات...</p>
</div>`;

const snap=await getDocs(collection(db,"products"));

allProducts=[];

const validCategories=[
"women",
"نسائي",
"قسم النسائي",
"القسم النسائي"
].map(c=>c.toLowerCase());

snap.forEach(doc=>{

const p=doc.data();

const category=(p.category||"").trim().toLowerCase();

if(!validCategories.some(c=>category.includes(c))) return;

allProducts.push({
id:doc.id,
...p
});

});

renderProducts(allProducts);

}

function renderProducts(list){

if(!list.length){

grid.innerHTML=`
<div class="loading-products">
لا توجد منتجات في القسم النسائي
</div>`;
return;

}

grid.innerHTML="";

list.forEach(product=>{

const image=
product.image||
product.img||
product.imageUrl||
"images/no-image.png";

grid.innerHTML+=`

<div class="product-card">

<div class="product-image">

<img src="${image}"
alt="${product.name}"
loading="lazy"
onerror="this.src='images/no-image.png'">

</div>

<div class="product-info">

<h3 class="product-title">

${product.name||"بدون اسم"}

</h3>

<div class="product-price">

${Number(product.price||0).toLocaleString()} د.ع

</div>

<div class="product-actions">

<button
class="add-cart"
data-id="${product.id}">

<i class="fa-solid fa-cart-shopping"></i>

إضافة للسلة

</button>

<a
href="details.html?id=${product.id}"
class="details-btn">

عرض التفاصيل

</a>

</div>

</div>

</div>

`;

});

}
    function updateCartCount(){

const cart=JSON.parse(localStorage.getItem("cart"))||[];

const total=cart.reduce((sum,item)=>sum+(item.qty||0),0);

if(cartCount){
cartCount.textContent=total;
}

}

function addToCart(product){

let cart=JSON.parse(localStorage.getItem("cart"))||[];

const index=cart.findIndex(item=>item.id===product.id);

if(index>-1){

cart[index].qty+=1;

}else{

cart.push({
id:product.id,
name:product.name,
price:Number(product.price||0),
image:product.image||product.img||product.imageUrl||"images/no-image.png",
qty:1
});

}

localStorage.setItem("cart",JSON.stringify(cart));

updateCartCount();

alert("تمت إضافة المنتج إلى السلة");

}

document.addEventListener("click",(e)=>{

const btn=e.target.closest(".add-cart");

if(!btn) return;

const product=allProducts.find(p=>p.id===btn.dataset.id);

if(product){

addToCart(product);

}

});

searchInput.addEventListener("input",()=>{

const text=searchInput.value.trim().toLowerCase();

const filtered=allProducts.filter(product=>

(product.name||"").toLowerCase().includes(text)||
(product.description||"").toLowerCase().includes(text)||
(product.colors||"").toLowerCase().includes(text)

);

renderProducts(text?filtered:allProducts);

});

if(localStorage.getItem("theme")==="dark"){

document.body.classList.add("dark-mode");

darkBtn.innerHTML='<i class="fa-solid fa-sun"></i>';

}

darkBtn.addEventListener("click",()=>{

document.body.classList.toggle("dark-mode");

const dark=document.body.classList.contains("dark-mode");

localStorage.setItem("theme",dark?"dark":"light");

darkBtn.innerHTML=dark
?'<i class="fa-solid fa-sun"></i>'
:'<i class="fa-solid fa-moon"></i>';

});

window.addEventListener("focus",updateCartCount);
window.addEventListener("storage",updateCartCount);

document.addEventListener("DOMContentLoaded",async()=>{

updateCartCount();

await loadWomenProducts();

const loader=document.getElementById("loader");

if(loader){

setTimeout(()=>{

loader.style.opacity="0";

setTimeout(()=>loader.remove(),300);

},300);

}

});

</script>

<footer class="main-footer">

<div class="container">

<p>

© 2026 مجمع حمزه الشطري - جميع الحقوق محفوظة

</p>

<div class="footer-links">

<a href="index.html">الرئيسية</a>

<a href="offers.html">العروض</a>

<a href="about.html">من نحن</a>

<a href="cart.html">السلة</a>

</div>

</div>

</footer>

   <script type="module" src="./js/main.js"></script> 
</body>

</html>
